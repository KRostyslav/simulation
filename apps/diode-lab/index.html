<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Дослідження ВАХ напівпровідникового діода</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__title">ВАХ напівпровідникового діода</span>
          <span class="topbar__mode" id="mode-host"></span>
        </div>
        <div class="topbar__tools">
          <button type="button" class="btn" id="protocol-btn">Хід роботи</button>
          <button type="button" class="btn" id="codex-btn">Довідник</button>
          <button type="button" class="btn btn--ghost" id="reset-btn">Скинути</button>
        </div>
      </header>

      <main class="layout">
        <section class="stage">
          <div class="stage__canvas" id="scene">
            <div class="labels" id="labels"></div>
          </div>
          <div class="stage__views" id="view-host"></div>
          <div class="stage__actions" id="actions"></div>
          <ul class="legend" id="legend"></ul>
          <p class="stage__note" id="scale-note"></p>
          <div id="commentary"></div>
        </section>

        <aside class="panel">
          <div id="controls"></div>
          <div id="readouts-host"></div>
          <div id="table"></div>
          <div id="analysis"></div>
          <div id="warnings"></div>
          <div id="tasks"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
